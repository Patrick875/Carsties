services:
  postgres:
    image: postgres:17
    environment:
      - POSTGRES_PASSWORD=12345
    ports:
      - 5433:5432
    volumes:
      - /var/lib/postgresql
  mongodb:
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=12345
    ports:
      - 27017:27017
    volumes:
      - /data/db
